name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  LDFLAGS: -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }} -s -w

jobs:
  create-release:
    name: Create release and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s ([%h](https://github.com/ARCOOON/arx-ca/commit/%H))" >> CHANGELOG.md
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s ([%h](https://github.com/ARCOOON/arx-ca/commit/%H))" >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md

  build-linux:
    name: Build Linux binaries
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build arx Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-linux-amd64 ./cmd/arx

      - name: Build arx Linux arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-linux-arm64 ./cmd/arx

      - name: Build arx-agent Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-agent-linux-amd64 ./cmd/arx-agent

      - name: Build arx-agent Linux arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-agent-linux-arm64 ./cmd/arx-agent

      - name: Upload Linux release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            arx-linux-amd64
            arx-linux-arm64
            arx-agent-linux-amd64
            arx-agent-linux-arm64

  build-windows:
    name: Build Windows binaries
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build arx Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-windows-amd64.exe ./cmd/arx

      - name: Build arx-agent Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-agent-windows-amd64.exe ./cmd/arx-agent

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            arx-windows-amd64.exe
            arx-agent-windows-amd64.exe

  build-darwin:
    name: Build Darwin binaries
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build arx Darwin amd64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-darwin-amd64 ./cmd/arx

      - name: Build arx Darwin arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-darwin-arm64 ./cmd/arx

      - name: Build arx-agent Darwin amd64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-agent-darwin-amd64 ./cmd/arx-agent

      - name: Build arx-agent Darwin arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags="${{ env.LDFLAGS }}" -o arx-agent-darwin-arm64 ./cmd/arx-agent

      - name: Upload Darwin release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            arx-darwin-amd64
            arx-darwin-arm64
            arx-agent-darwin-amd64
            arx-agent-darwin-arm64

  build-webui:
    name: Build WebUI distribution
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Build WebUI
        working-directory: webui
        run: npm run build

      - name: Package WebUI distribution tarball
        run: tar -czf webui-dist.tar.gz -C webui/dist .

      - name: Upload WebUI release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: webui-dist.tar.gz
