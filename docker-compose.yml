services:
  arx-ca:
    image: arx-ca-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arx-ca
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      CA_API_JWT_SECRET: ${CA_API_JWT_SECRET:?Set CA_API_JWT_SECRET in the environment or a .env file}
      CA_API_JWT_ISSUER: ${CA_API_JWT_ISSUER:-arx-ca}
      CA_API_JWT_EXPIRY: ${CA_API_JWT_EXPIRY:-24h}
      CA_API_LISTEN_ADDR: ":8080"
      CA_API_CA_CONFIG: "/app/data/config/ca.json"
    volumes:
      - ./data/arx-ca:/app/data
